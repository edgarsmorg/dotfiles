# Esta instancia solo controla las pantallas mientras la sesión está bloqueada.
# Aplicar DPMS explícitamente a cada monitor activo.
listener {
  timeout = 20
  ignore_inhibit = true
  on-timeout = hyprctl eval 'for _, monitor in ipairs(hl.get_monitors()) do hl.dispatch(hl.dsp.dpms({ monitor = monitor.name, action = "off" })) end'
  on-resume = hyprctl eval 'for _, monitor in ipairs(hl.get_monitors()) do hl.dispatch(hl.dsp.dpms({ monitor = monitor.name, action = "on" })) end'
}
