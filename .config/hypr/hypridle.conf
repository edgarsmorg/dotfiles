general {
  lock_cmd = pidof hyprlock || hyprlock
  # Iniciar el temporizador de pantallas al bloquear y detenerlo al desbloquear.
  on_lock_cmd = pkill -f '^hypridle -c .*/hypridle-locked\.conf$'; hypridle -c ~/.config/hypr/hypridle-locked.conf
  on_unlock_cmd = pkill -f '^hypridle -c .*/hypridle-locked\.conf$'; hyprctl eval 'for _, monitor in ipairs(hl.get_monitors()) do hl.dispatch(hl.dsp.dpms({ monitor = monitor.name, action = "on" })) end'
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl eval 'for _, monitor in ipairs(hl.get_monitors()) do hl.dispatch(hl.dsp.dpms({ monitor = monitor.name, action = "on" })) end'
}

listener {
  timeout = 300
  on-timeout = brightnessctl -s set 10
  on-resume = brightnessctl -r
}

listener {
  timeout = 330
  on-timeout = loginctl lock-session
}

listener {
  timeout = 600
  on-timeout = grep -q "Discharging" /sys/class/power_supply/BAT*/status && systemctl suspend
}
